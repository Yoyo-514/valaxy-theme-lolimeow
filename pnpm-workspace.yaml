catalogMode: prefer
cleanupUnusedCatalogs: true
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - langium
  - semver
  - valaxy-addon-waline
  - cytoscape
  - why-is-node-running

publicHoistPattern:
  - vue
  - vue-router
  - vue-i18n
  - vite
  - unocss
  - vite-plugin-vue-layouts-next
  - '@iconify-json/ri'

shellEmulator: true

packages:
  - theme
  - demo
  - docs

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

catalog:
  '@antfu/eslint-config': ^10.0.0
  '@iconify-json/ri': ^1.2.10
  '@playwright/test': ^1.64.1
  '@types/d3-cloud': 1.2.9
  '@types/node': ^26.6.5
  '@unhead/vue': ^3.4.3
  '@unocss/eslint-plugin': ^66.11.0
  '@vueuse/core': ^15.0.0
  '@waline/client': 3.16.1
  bumpp: ^12.3.0
  d3-cloud: 1.2.9
  eslint: ^10.13.0
  eslint-plugin-format: ^2.0.1
  knip: ^6.42.1
  tabbable: ^6.5.0
  typescript: ^6.0.3
  unocss: 66.11.0
  valaxy: 1.2.0
  valaxy-addon-mermaid: 0.1.1
  valaxy-addon-waline: ^0.2.1
  vite: 8.3.5
  vitepress: 2.0.0-alpha.17
  vitest: ^5.0.5
  vue: 3.5.44
  vue-tsc: ^3.3.13
