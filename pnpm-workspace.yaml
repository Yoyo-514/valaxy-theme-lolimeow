catalogMode: prefer
cleanupUnusedCatalogs: true
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - langium
  - semver
  - valaxy-addon-waline
  - cytoscape
  - why-is-node-running

publicHoistPattern:
  - vue
  - vue-router
  - vue-i18n
  - vite
  - unocss
  - vite-plugin-vue-layouts-next
  - '@iconify-json/ri'

shellEmulator: true

packages:
  - theme
  - demo
  - docs

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@iconify-json/ri': ^1.2.10
  '@playwright/test': ^1.63.0
  '@types/d3-cloud': 1.2.9
  '@unhead/vue': ^3.4.2
  '@unocss/eslint-plugin': ^66.10.5
  '@vueuse/core': ^15.0.0
  bumpp: ^12.3.0
  d3-cloud: 1.2.9
  eslint: ^10.11.0
  eslint-plugin-format: ^2.0.1
  knip: ^6.38.0
  typescript: ^6.0.3
  unocss: 66.10.5
  valaxy: 1.0.0-rc.16
  valaxy-addon-mermaid: 0.1.0
  valaxy-addon-waline: ^0.2.1
  vite: 8.3.1
  vitepress: 2.0.0-alpha.17
  vitest: ^5.0.2
  vue: 3.5.43
  vue-tsc: ^3.3.11
