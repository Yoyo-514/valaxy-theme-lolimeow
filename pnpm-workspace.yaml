catalogMode: prefer

cleanupUnusedCatalogs: true
minimumReleaseAge: 0
shamefullyHoist: true

# publicHoistPattern:
#   - vue
#   - vue-router
#   - vue-i18n
#   - vite
#   - unocss
#   - vite-plugin-vue-layouts-next
#   - '@iconify-json/ri'

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - langium@3.3.1
  - semver@6.3.1
  - valaxy-addon-waline@0.2.1
packages:
  - theme
  - demo
  - docs

overrides:
  '@vue/compiler-core': 3.5.40
  '@vue/compiler-dom': 3.5.40
  '@vue/compiler-sfc': 3.5.40
  '@vue/compiler-ssr': 3.5.40
  '@vue/reactivity': 3.5.40
  '@vue/runtime-core': 3.5.40
  '@vue/runtime-dom': 3.5.40
  '@vue/server-renderer': 3.5.40
  '@vue/shared': 3.5.40
  vue: 3.5.40

catalog:
  '@antfu/eslint-config': ^9.2.0
  '@iconify-json/ant-design': ^1.2.8
  '@iconify-json/simple-icons': ^1.2.91
  '@unhead/vue': ^2.1.13
  '@unocss/eslint-plugin': ^66.7.5
  '@vueuse/core': ^14.3.0
  bumpp: ^12.0.0
  eslint: ^10.8.0
  eslint-plugin-format: ^2.0.1
  typescript: ^6.0.3
  valaxy: ^0.28.11
  valaxy-addon-waline: ^0.2.1
  vitepress: 2.0.0-alpha.17
  vitest: ^4.1.10
  vue-tsc: ^3.3.8

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
