catalogMode: prefer

cleanupUnusedCatalogs: true
minimumReleaseAge: 0

publicHoistPattern:
  - vue
  - vue-router
  - vue-i18n
  - vite
  - unocss
  - vite-plugin-vue-layouts-next
  - '@iconify-json/ri'

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar
  - langium
  - semver
  - valaxy-addon-waline
  - cytoscape
packages:
  - theme
  - demo
  - docs

overrides:
  '@vue/compiler-core': 3.5.41
  '@vue/compiler-dom': 3.5.41
  '@vue/compiler-sfc': 3.5.41
  '@vue/compiler-ssr': 3.5.41
  '@vue/reactivity': 3.5.41
  '@vue/runtime-core': 3.5.41
  '@vue/runtime-dom': 3.5.41
  '@vue/server-renderer': 3.5.41
  '@vue/shared': 3.5.41
  vue: 3.5.41

catalog:
  '@antfu/eslint-config': ^9.3.0
  '@iconify-json/ri': ^1.2.10
  '@unhead/vue': ^3.3.2
  '@unocss/eslint-plugin': ^66.7.5
  '@vueuse/core': ^14.4.0
  bumpp: ^12.2.1
  eslint: ^10.8.1
  eslint-plugin-format: ^2.0.1
  typescript: ^6.0.3
  valaxy: 1.0.0-rc.6
  valaxy-addon-waline: ^0.2.1
  vitepress: 2.0.0-alpha.17
  vitest: ^4.1.10
  vue-tsc: ^3.3.10

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
